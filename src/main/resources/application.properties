spring.application.name=ms-andesstay-reservations
server.port=${SERVER_PORT:8082}

# --- Conexion a PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/andesstay_reservations
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Microservicio de catalogo (valida la unidad, capacidad y precio/noche) ---
andesstay.services.catalog.base-url=${CATALOG_SERVICE_URL:http://localhost:8081}

# --- Kafka (productor) ---
# localhost:9092 porque asi queda expuesto el listener PLAINTEXT_HOST en el
# docker-compose de infra/kafka del proyecto (mismo broker que consume audit).
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# acks=all: no se da el evento por publicado hasta que todas las replicas del
# broker lo confirman - preferimos esperar un poco mas antes que perder un
# evento de negocio (auditoria depende de que estos eventos lleguen).
spring.kafka.producer.acks=all

# Topico donde se publican los eventos de negocio de la reserva.
# Debe coincidir con "audit.kafka.topic" en ms-andesstay-audit.
reservations.kafka.topic=reservations.events

# --- Seguridad: AWS Cognito (mismo User Pool que catalog y audit) ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.${COGNITO_REGION:us-east-1}.amazonaws.com/${COGNITO_USER_POOL_ID:CHANGE_ME}
cognito.app-client-id=${COGNITO_APP_CLIENT_ID:CHANGE_ME}

logging.level.org.springframework.security=INFO
logging.level.cl.duoc.andesstay.reservations=DEBUG
