spring.application.name=ms-andesstay-reservations
server.port=${SERVER_PORT:8082}

# --- Conexion a PostgreSQL ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/andesstay_reservations}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# --- Microservicio de catalogo ---
andesstay.services.catalog.base-url=${CATALOG_SERVICE_URL:http://localhost:8081}

# --- Kafka (productor - topico audit) ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

# --- Kafka (consumidor - reporteria) ---
spring.kafka.consumer.group-id=${REPORT_GROUP_ID:report-generator}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

# Topico audit (no cambiar - ms-andesstay-audit depende de esto)
reservations.kafka.topic=reservations.events

# Topico de reporteria (nuevo en Entrega 3)
reporteria.kafka.topic=${REPORT_TOPIC:reporteria-eventos}
reporteria.kafka.group-id=${REPORT_GROUP_ID:report-generator}
reporteria.kafka.topic-replicas=${REPORT_TOPIC_REPLICAS:1}

# --- Seguridad: AWS Cognito ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.${COGNITO_REGION:us-east-1}.amazonaws.com/${COGNITO_USER_POOL_ID:CHANGE_ME}
cognito.app-client-id=${COGNITO_APP_CLIENT_ID:CHANGE_ME}
# Rol asignado a usuarios sin grupos en Cognito (recien registrados)
security.default-role=${DEFAULT_ROLE:HUESPED}

# --- CORS ---
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- Demo ---
demo.enabled=${DEMO_ENABLED:false}

# --- Actuator + Prometheus ---
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=ms-andesstay-reservations
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# --- OpenAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.org.springframework.security=INFO
logging.level.cl.duoc.andesstay.reservations=DEBUG
