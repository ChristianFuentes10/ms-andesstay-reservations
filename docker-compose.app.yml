# Microservicio ms-andesstay-reservations
# Requisito: docker network create andesstay-net
# Requisito: Kafka y PostgreSQL deben estar corriendo
version: "3.9"

services:
  ms-reservations:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: andesstay-ms-reservations
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8082}:8082"
    environment:
      SERVER_PORT: 8082
      DB_URL: ${DB_URL:-jdbc:postgresql://host.docker.internal:5432/andesstay_reservations}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL:-http://host.docker.internal:8081}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-1:29092,kafka-2:29093}
      REPORT_TOPIC: ${REPORT_TOPIC:-reporteria-eventos}
      REPORT_GROUP_ID: ${REPORT_GROUP_ID:-report-generator}
      REPORT_TOPIC_REPLICAS: ${REPORT_TOPIC_REPLICAS:-2}
      COGNITO_REGION: ${COGNITO_REGION:-us-east-1}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-CHANGE_ME}
      COGNITO_APP_CLIENT_ID: ${COGNITO_APP_CLIENT_ID:-CHANGE_ME}
      DEFAULT_ROLE: ${DEFAULT_ROLE:-HUESPED}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - andesstay-net

networks:
  andesstay-net:
    external: true
