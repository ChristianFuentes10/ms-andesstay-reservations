apiVersion: 1

datasources:
  # Fuente de datos Prometheus para metricas tecnicas
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  # Fuente de datos PostgreSQL para KPIs de negocio
  - name: PostgreSQL
    type: postgres
    url: ${GF_DB_HOST}
    database: ${GF_DB_NAME}
    user: ${GF_DB_USER}
    secureJsonData:
      password: ${GF_DB_PASSWORD}
    jsonData:
      sslmode: "disable"
      postgresVersion: 1500
      timescaledb: false
    editable: false
