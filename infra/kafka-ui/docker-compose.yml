# Kafka-UI: interfaz web para administrar brokers y topicos
# Requisito: docker network create andesstay-net
# Requisito: Kafka debe estar corriendo (infra/kafka/docker-compose.yml)
version: "3.9"

services:
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: andesstay-kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: andesstay-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29093
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USER:-admin}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD:-changeme123}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - andesstay-net

networks:
  andesstay-net:
    external: true
