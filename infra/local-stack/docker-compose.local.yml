# AndesStay - stack local para PROBAR los microservicios juntos (no es para AWS).
#
# Ubicacion esperada de este archivo:
#   <carpeta-padre>/ms-andesstay-reservations/infra/local-stack/
# y los demas repos clonados como hermanos de ms-andesstay-reservations:
#   <carpeta-padre>/ms-andesstay-catalog, ms-andesstay-audit, ms-andesstay-users
#
# Pasos:
#   1) docker network create andesstay-net
#   2) cd ../kafka && docker compose up -d            (Kafka compartido)
#   3) cd ../local-stack && copy .env.example .env     (y completar Cognito)
#   4) docker compose -f docker-compose.local.yml --env-file .env up -d --build
# El BFF y el frontend se corren aparte (npm start / mvn spring-boot:run).

services:
  postgres:
    image: postgres:16-alpine
    container_name: andesstay-local-db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports: ["5432:5432"]
    volumes:
      - local_pgdata:/var/lib/postgresql/data
      - ./init-dbs.sh:/docker-entrypoint-initdb.d/01-init-dbs.sh:ro
      - ../../../ms-andesstay-catalog/src/main/resources/schema.sql:/seed/schema.sql:ro
      - ../../../ms-andesstay-catalog/src/main/resources/data.sql:/seed/data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      retries: 10
    networks: [andesstay-net]

  catalog:
    build: ../../../ms-andesstay-catalog
    container_name: andesstay-local-catalog
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["8081:8081"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/andesstay_catalog
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      COGNITO_REGION: ${COGNITO_REGION:-us-east-1}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_APP_CLIENT_ID: ${COGNITO_APP_CLIENT_ID}
      FRONTEND_URL: http://localhost:4200
      CORS_ENABLED: "true"
    networks: [andesstay-net]

  reservations:
    build: ../..
    container_name: andesstay-local-reservations
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["8082:8082"]
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/andesstay_reservations
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      CATALOG_SERVICE_URL: http://catalog:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29093
      REPORT_TOPIC_REPLICAS: 2
      COGNITO_REGION: ${COGNITO_REGION:-us-east-1}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_APP_CLIENT_ID: ${COGNITO_APP_CLIENT_ID}
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
    networks: [andesstay-net]

  audit:
    build: ../../../ms-andesstay-audit
    container_name: andesstay-local-audit
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["8083:8083"]
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/andesstay_audit
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29093
      KAFKA_TOPIC_REPLICAS: 2
      COGNITO_REGION: ${COGNITO_REGION:-us-east-1}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_APP_CLIENT_ID: ${COGNITO_APP_CLIENT_ID}
      FRONTEND_URL: http://localhost:4200
    networks: [andesstay-net]

  # Micro de usuarios (Christian). SIN VERIFICAR: ver notas en prompts-equipo.md.
  # Publica sus eventos en 'users.events' para no mezclarlos con 'reporteria-eventos'.
  users:
    build: ../../../ms-andesstay-users
    container_name: andesstay-local-users
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["8085:8085"]
    environment:
      SERVER_PORT: 8085
      DB_URL: jdbc:postgresql://postgres:5432/andesstay_users
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29093
      KAFKA_TOPIC_REPORTERIA: users.events
      KAFKA_TOPIC_REPLICATION_FACTOR: 2
      COGNITO_REGION: ${COGNITO_REGION:-us-east-1}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_APP_CLIENT_ID: ${COGNITO_APP_CLIENT_ID}
      COGNITO_ADMIN_ENABLED: "false"
      FRONTEND_URL: http://localhost:4200
    networks: [andesstay-net]

volumes:
  local_pgdata:

networks:
  andesstay-net:
    external: true
